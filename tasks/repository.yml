---
# apt-key is gone from Debian 13 and Ubuntu 26.04, so keep the Microsoft keys
# in /etc/apt/keyrings and scope them to this repository with signed-by.
- name: Create the apt keyrings directory.
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - not uninstall | bool
    - ansible_os_family == "Debian"
  tags:
    - debian
    - repo

- name: Add Microsoft apt keys.
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.name }}.asc"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ mde_signing_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not uninstall | bool
    - ansible_os_family == "Debian"
  tags:
    - debian
    - repo

- name: Add Microsoft apt repository for Defender.
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=arm64,armhf,amd64 signed-by={{ mde_apt_keyrings }}]
      https://packages.microsoft.com/{{ ansible_distribution | lower }}/{{ mde_deb_version }}/prod
      {{ (channel == 'prod') | ternary(ansible_distribution_release, channel) }} main
    filename: "microsoft-{{ channel }}"
    update_cache: true
    state: "{{ uninstall | bool | ternary('absent', 'present') }}"
  when: ansible_os_family == "Debian"
  tags:
    - debian
    - repo

- name: Remove Microsoft apt keys.
  ansible.builtin.file:
    path: "/etc/apt/keyrings/{{ item.name }}.asc"
    state: absent
  loop: "{{ mde_signing_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - uninstall | bool
    - ansible_os_family == "Debian"
  tags:
    - debian
    - repo

- name: Add Microsoft rpm keys.
  ansible.builtin.rpm_key:
    key: "{{ item.url }}"
    fingerprint: "{{ item.fingerprint }}"
    state: "{{ uninstall | bool | ternary('absent', 'present') }}"
  loop: "{{ mde_signing_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when: ansible_os_family == "RedHat"
  tags:
    - redhat
    - repo

- name: Add Microsoft yum repository for Defender.
  ansible.builtin.yum_repository:
    name: "packages-microsoft-com-{{ channel }}"
    description: Microsoft Defender Endpoint for Linux
    file: "microsoft-{{ channel }}"
    baseurl: "https://packages.microsoft.com/{{ mde_rpm_distro }}/{{ ansible_distribution_major_version }}/{{ channel }}/"
    gpgcheck: true
    enabled: true
    state: "{{ uninstall | bool | ternary('absent', 'present') }}"
  when: ansible_os_family == "RedHat"
  tags:
    - redhat
    - repo
