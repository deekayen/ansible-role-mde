---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Update the apt cache.
  ansible.builtin.apt:
    update_cache: true
  when:
    - not uninstall | bool
    - ansible_facts.os_family == "Debian"
  tags:
    - install
    - dependencies

# EL 9 and Amazon Linux 2023 ship curl-minimal, which provides the curl
# command but conflicts with the curl package, so only add curl if missing.
- name: Check for the curl command.
  ansible.builtin.stat:
    path: /usr/bin/curl
  register: mde_curl
  when: not uninstall | bool
  tags:
    - install
    - dependencies

- name: Install documented dependencies.
  ansible.builtin.package:
    name: "{{ ['unzip'] + ([] if mde_curl.stat.exists else ['curl']) }}"
    state: present
  when: not uninstall | bool
  tags:
    - install
    - dependencies

- name: Install undocumented dependencies for EL 8.
  ansible.builtin.dnf:
    name:
      - audispd-plugins
    state: present
  when:
    - not uninstall | bool
    - ansible_facts.os_family == "RedHat"
    - ansible_facts.distribution_major_version == "8"
  tags:
    - install
    - dependencies

- name: Install documented Debian dependencies.
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - libplist-utils
      - python3-apt
      - gnupg
    state: present
  when:
    - not uninstall | bool
    - ansible_facts.os_family == "Debian"
  tags:
    - install
    - dependencies

- name: Setup packages.microsoft.com repository.
  ansible.builtin.include_tasks: repository.yml

- name: Unzip the onboarding package from Microsoft Defender Security Center.
  ansible.builtin.include_tasks: onboarding_setup.yml

- name: Manage the Defender package from Microsoft.
  ansible.builtin.include_tasks: package.yml

- name: Check for install log.
  ansible.builtin.stat:
    path: "{{ install_log }}"
  register: mdatp_install_log
  when: ansible_verbosity > 2
  tags:
    - debug

- name: Show the mdatp install log.
  when:
    - mdatp_install_log.stat.exists is defined
    - mdatp_install_log.stat.exists
    - mdatp_install_log.stat.size > 0
  tags:
    - debug
  block:
    - name: Load install log contents.
      ansible.builtin.command: "cat {{ install_log }}"
      register: mdatp_install
      changed_when: false

    - name: "DEBUG: Print mdatp install log to console."
      ansible.builtin.debug:
        msg: "{{ mdatp_install.stdout }}"
        verbosity: 3
